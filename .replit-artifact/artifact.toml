kind = "web"
previewPath = "/"
title = "Ghouri Mobile Mall"
version = "1.0.0"
id = "artifacts/ghouri-mobile-mall"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18231

[services.development]
run = "pnpm --filter @workspace/ghouri-mobile-mall run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ghouri-mobile-mall", "run", "build" ]
publicDir = "artifacts/ghouri-mobile-mall/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18231"
BASE_PATH = "/"
